apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Values.nodeClass.name }}
spec:
  role: {{ .Values.nodeClass.role | default (printf "KarpenterNodeRole-%s" .Values.clusterName) | quote }}
  amiSelectorTerms:
    - alias: {{ .Values.nodeClass.amiAlias | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ .Values.nodeClass.volumeSize }}
        volumeType: gp3
        encrypted: true
