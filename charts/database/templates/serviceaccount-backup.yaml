{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "db.fullname" . }}-backup
  labels:
    {{- include "db.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "backup.roleArn is required (IRSA role with S3 access)" .Values.backup.roleArn | quote }}
{{- end }}
