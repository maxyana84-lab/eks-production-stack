{{- if .Values.externalSecret.enabled }}
{{- $es := .Values.externalSecret }}
{{- if $es.secretStore.create }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ $es.secretStore.name }}
  labels:
    {{- include "db.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $es.secretStore.region }}
      # no "auth": the operator's ServiceAccount carries the IAM role (IRSA)
---
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $es.name }}
  labels:
    {{- include "db.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.secretStore.name }}
  target:
    name: {{ $es.name }}
    creationPolicy: Owner
  data:
    {{- range $es.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $es.remoteKey }}
        property: {{ . }}
    {{- end }}
{{- end }}
