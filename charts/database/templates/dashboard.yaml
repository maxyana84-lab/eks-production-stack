{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "db.fullname" . }}-dashboard
  labels:
    {{- include "db.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  database-dashboard.json: |-
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
