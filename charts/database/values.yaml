# ---------------------------------------------------------------------------
# Everything under "postgresql:" overrides the Bitnami chart (dependency name = key).
# ---------------------------------------------------------------------------
postgresql:
  fullnameOverride: database-postgresql   # StatefulSet / Service name (the host the backend connects to)

  # Bitnami stopped publishing versioned images under docker.io/bitnami; the same tags live in bitnamilegacy.
  # The charts refuse a different registry unless this flag is set.
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/postgresql
  metrics:
    enabled: true                         # postgres-exporter sidecar (Task 5.2)
    image:
      repository: bitnamilegacy/postgres-exporter
    serviceMonitor:
      enabled: true                       # the Bitnami built-in ServiceMonitor
      interval: 30s
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

  # No password in this repository: the credentials Secret is created by the ExternalSecrets operator
  # from AWS Secrets Manager (templates/externalsecret.yaml). The username must match the AWS secret.
  auth:
    username: app
    database: appdb
    existingSecret: db-credentials
    secretKeys:
      adminPasswordKey: password
      userPasswordKey: password

  primary:
    persistence:
      enabled: true
      storageClass: gp3
      size: 20Gi
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "1", memory: 2Gi}
    # DB pods are scheduled only on the db nodes (hard rule) and tolerate their taint
    nodeAffinityPreset:
      type: hard
      key: role
      values: [db]
    tolerations:
      - key: workload
        operator: Equal
        value: database
        effect: NoSchedule

# ---------------------------------------------------------------------------
# Custom templates of this wrapper chart
# ---------------------------------------------------------------------------
externalSecret:
  enabled: true
  name: db-credentials                   # the K8s Secret that is created (the backend references this name)
  refreshInterval: 1h
  secretStore:
    create: true
    name: aws-secrets-manager
    region: us-east-1
  remoteKey: my-app/production/db-credentials   # JSON with username, password, host, port
  keys: [username, password, host, port]

vpa:
  enabled: true
  updateMode: "Off"                      # recommendations only

dashboard:
  enabled: true

backup:
  enabled: true
  schedule: "0 */6 * * *"                # every 6 hours
  bucket: my-app-db-backups              # name of the S3 bucket (see aws/)
  prefix: backups
  # IAM role for the backup ServiceAccount (IRSA); no AWS keys anywhere
  roleArn: arn:aws:iam::111111111111:role/db-backup
  image:
    dump: postgres:17-alpine             # contains pg_dump (keep the major version >= the server)
    upload: amazon/aws-cli:2.17.0
  # S3 lifecycle (applied with aws/s3-lifecycle.json, generated by scripts/gen_s3_lifecycle.py)
  retention:
    standardIaDays: 30
    glacierDays: 60
    expireDays: 90
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
