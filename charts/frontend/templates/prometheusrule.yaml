{{- if and .Values.metrics.enabled .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  groups:
    - name: {{ include "app.fullname" . }}.rules
      rules:
        - alert: {{ .Chart.Name | title }}HighErrorRate
          expr: |
            100 * sum(rate(http_requests_total{service="{{ .Chart.Name }}",code=~"5.."}[5m]))
              / sum(rate(http_requests_total{service="{{ .Chart.Name }}"}[5m]))
            > {{ .Values.alerts.errorRatePercent }}
          for: {{ .Values.alerts.for }}
          labels:
            severity: critical
          annotations:
            summary: "{{ .Chart.Name }}: more than {{ .Values.alerts.errorRatePercent }}% of requests fail"
            description: "The 5xx share has been above {{ .Values.alerts.errorRatePercent }}% for {{ .Values.alerts.for }}."
{{- end }}
